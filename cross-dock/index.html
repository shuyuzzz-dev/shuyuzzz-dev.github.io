element('section', { class: 'card-section' }, [
element('h3', { text: words.reviewHeading }),
element('ol', { class: 'review-list' }, scenarios.map(reviewItem))
]),
element('div', { class: 'actions stack' }, [
button(words.retake, 'primary', function () { startOver({ focus: true }); }),
button(words.resultsExplore, 'quiet', explore)
])
]);
present(node, settings, { title: words.resultsTitle });
scene.fit(frameOptions());
}
function reviewItem(item, index) {
const pick = quiz.picks[index];
const right = pick === item.right;
const stop = tourStops[item.tourStop];
return element('li', null, element('details', { class: 'review-item tone-' + (right ? 'ok' : 'bad'), open: !right, 'data-scenario': item.id }, [
element('summary', { class: 'review-summary' }, [
element('span', { class: 'review-mark', 'aria-hidden': 'true', text: right ? words.stateOkMark : words.stateBadMark }),
element('span', { class: 'review-heading' }, [
element('span', { class: 'review-count', text: fill(words.scenarioCounter, { n: index + 1, total: TOTAL }) }),
element('span', { class: 'review-title', text: item.title }),
element('span', { class: 'visually-hidden', text: right ? words.verdictRight : words.verdictWrong })
])
]),
element('div', { class: 'review-body' }, [
element('span', { class: 'block-label', text: words.reviewYourAnswer }),
element('p', { text: pick === null ? '' : item.answers[pick] }),
right ? null : [element('span', { class: 'block-label', text: words.reviewRightAnswer }), element('p', { text: item.answers[item.right] })],
element('span', { class: 'block-label', text: words.reviewWhy }),
element('p', { text: item.why }),
element('div', { class: 'actions review-actions' }, [
button(words.reviewShow, 'review-show', function () { openScenario(index, { review: true, play: true, focus: true }); }),
element('button', {
class: 'link-button review-revisit', type: 'button', text: fill(words.reviewRevisit, { n: item.tourStop + 1, title: stop.title }),
onclick: function () { ui.startTour(item.tourStop, { focus: true }); }
})
])
])
]));
}
function markStates(marks) {
const states = {};
Object.keys(marks).forEach(function (id) { states[id] = sim.areaState(id); });
return states;
}
const STATE_RANK = { ok: 0, slow: 1, blocked: 2, starved: 2, stopped: 2 };
const SAMPLE_TICKS = 5;
const WORST_TICKS = 10;
const HELD_LIMIT = 0.2;
function trackShown(store) {
const time = sim.time();
Object.keys(areaWords).forEach(function (id) { XD.draw.stepTrack(store, id, sim.areaState(id), time, false); });
}
function runSampled(seconds, worst, marks, store, tally) {
const ticks = Math.max(0, Math.round(seconds / sim.tick));
const areaIds = Object.keys(areaWords);
const lookWorst = function () {
areaIds.forEach(function (id) {
const state = sim.areaState(id);
if (state && (!worst[id] || STATE_RANK[state] > STATE_RANK[worst[id]])) worst[id] = state;
});
};
const lookMarks = function () {
Object.keys(marks).forEach(function (id) {
const entry = tally[id] || (tally[id] = { samples: 0, misfit: 0 });
const shown = store[id] ? store[id].shown : sim.areaState(id);
entry.samples += 1;
if (MARK_FIT[marks[id]].indexOf(shown) < 0) entry.misfit += 1;
});
};
lookWorst();
for (let count = 1; count <= ticks; count++) {
sim.run(sim.tick);
trackShown(store);
if (count % SAMPLE_TICKS === 0) lookMarks();
if (count % WORST_TICKS === 0 || count === ticks) lookWorst();
}
app.run(0);
}
function truthIssues(entries, right) {
const allowed = {};
right.worst.forEach(function (worst) {
Object.keys(worst).forEach(function (id) {
if (!allowed[id] || STATE_RANK[worst[id]] > STATE_RANK[allowed[id]]) allowed[id] = worst[id];
});
});
entries.forEach(function (entry) {
if (entry.right) return;
entry.worst.forEach(function (worst, i) {
if (!entry.truthSteps[i]) return;
const worse = Object.keys(worst).filter(function (id) {
return STATE_RANK[worst[id]] > STATE_RANK[allowed[id] || 'ok'];
});
if (!worse.length) return;
entry.issues.push('truth step ' + i + ' reads worse than the right outcome: ' + worse.map(function (id) {
return id + '=' + worst[id] + ' (right: ' + (allowed[id] || 'ok') + ')';
}).join(', '));
});
});
}
function playAll() {
const keep = { phase: quiz.phase, shown: quiz.shown, review: quiz.review };
stopPlayer();
setWatching(false);
player.instant = true;
const result = { ok: true, outcomes: [], hard: 0, soft: 0, held: 0, samples: 0, steps: 0, truth: 0 };
app.reset();
const baseTime = sim.time();
const baseCounters = JSON.stringify(sim.counters());
scenarios.forEach(function (item) {
const entries = [];
item.outcomes.forEach(function (outcome, k) {
const entry = { id: item.id, outcome: k, right: k === item.right, steps: [], issues: [], worst: [], truthSteps: [] };
entries.push(entry);
const store = {};
try {
enterOutcome(item);
outcome.steps.forEach(function (step, i) {
applyStep(item, step, i === 0);
trackShown(store);
const shown = scene.state();
const kickerText = step.truth ? words.kickerRightAnswer : words.kickerThisAnswer;
if (shown.caption !== step.say) entry.issues.push('step ' + i + ': the caption is not the step');
if (shown.kicker !== kickerText) entry.issues.push('step ' + i + ': the kicker is wrong');
const marks = shown.marks;
const start = markStates(marks);
const worst = {};
const tally = {};
runSampled(step.seconds, worst, marks, store, tally);
entry.worst.push(worst);
entry.truthSteps.push(!!step.truth);
const flags = [];
Object.keys(marks).forEach(function (id) {
const tone = marks[id];
const before = start[id];
const after = sim.areaState(id);
const count = tally[id] || { samples: 0, misfit: 0 };
result.samples += count.samples;
if (count.samples && count.misfit / count.samples > HELD_LIMIT) {
flags.push(tone + ':' + id + ' misfits ' + count.misfit + ' of ' + count.samples + ' samples (held)');
result.held += 1;
}
if (MARK_FIT[tone].indexOf(before) >= 0 || MARK_FIT[tone].indexOf(after) >= 0) return;
const hard = tone === 'ok' || (tone === 'bad' && before === 'ok' && after === 'ok');
flags.push(tone + ':' + id + '=' + before + '>' + after + (hard ? '' : ' (soft)'));
if (hard) result.hard += 1; else result.soft += 1;
});
entry.steps.push({ say: shown.caption, kicker: shown.kicker, marks: marks, tags: shown.tags, flags: flags });
result.steps += 1;
});
calm();
const after = scene.state();
const levers = sim.activeLevers();
if (levers.length) entry.issues.push('levers left on: ' + levers.map(function (lever) { return lever.name; }).join(', '));
if (sim.isPaused()) entry.issues.push('the sim is left paused');
if (sim.time() !== baseTime || JSON.stringify(sim.counters()) !== baseCounters) entry.issues.push('the sim is not back to the calm baseline');
if (after.caption || after.tags.length || after.routes || after.meters || after.lit.length || Object.keys(after.marks).length) {
entry.issues.push('the scene is not clear');
}
} catch (error) {
entry.issues.push('error: ' + (error && error.message ? error.message : String(error)));
}
});
const right = entries.filter(function (entry) { return entry.right; })[0];
entries.forEach(function (entry) { entry.before = entry.issues.length; });
if (right) truthIssues(entries, right);
entries.forEach(function (entry) {
result.truth += entry.issues.length - entry.before;
delete entry.before;
delete entry.worst;
delete entry.truthSteps;
if (entry.issues.length) result.ok = false;
result.outcomes.push(entry);
});
});
player.instant = false;
if (keep.phase === 'scenario') openScenario(keep.shown, { review: keep.review, focus: false });
else if (keep.phase === 'intro') openIntro({ focus: false });
else if (keep.phase === 'results') openResults({ focus: false });
else { quiz.dirty = false; scene.clear(); scene.fit({ instant: true }); }
return result;
}
function state() {
const index = quiz.phase === 'scenario' ? quiz.shown : quiz.index;
const item = scenarios[index];
const order = quiz.perms[index] || [];
const total = score();
return {
phase: quiz.phase, index: index, progress: quiz.index, total: TOTAL, id: item.id, kind: item.kind,
review: quiz.review, finished: quiz.finished, seed: quiz.seed,
order: order.slice(), orders: quiz.perms.map(function (list) { return list.slice(); }),
picks: quiz.picks.slice(), firstPick: quiz.picks[index], right: item.right, rightKey: order.indexOf(item.right),
score: total, pass: PASS, passed: total >= PASS, kinds: kindScores(),
playing: player.active, outcome: player.active ? player.outcome : null, step: player.active ? player.step : null,
steps: player.active ? player.steps.length : 0, last: player.last, timers: player.active ? 1 : 0, pace: player.pace,
stepAt: player.active ? player.stepAt : null,
watching: nodes.panel.classList.contains('watching'),
verdict: card && card.verdict ? card.verdict.textContent : null,
levers: sim.activeLevers().map(function (lever) { return lever.name + (lever.target ? ':' + lever.target : ''); }),
paused: sim.isPaused(),
sinceCalm: quiz.calmAt === null ? null : Math.round((sim.time() - quiz.calmAt) * 1000) / 1000
};
}
function setPace(options) {
if (options && options.pace !== undefined) player.pace = clamp(Number(options.pace) || 1, 0.25, 100);
}
function open(options) {
const settings = Object.assign({}, options || {});
setPace(settings);
if (settings.focus === undefined) settings.focus = defaultFocus();
if (quiz.finished) openResults(settings); else openIntro(settings);
return state();
}
function start(options) {
const settings = Object.assign({ focus: false }, options || {});
setPace(settings);
startOver({ focus: settings.focus });
return state();
}
function pick(position) {
let at = position;
if (typeof at === 'string') at = 'abcd'.indexOf(at.toLowerCase());
if (quiz.phase === 'scenario' && Number.isInteger(at)) choose(at);
return state();
}
function next() { goOn(); return state(); }
function init(options) {
ui = XD.ui;
app = XD.app;
scene = XD.scene;
element = ui.element;
fill = ui.fill;
sim = (options && options.sim) || app.sim;
nodes.panel = document.getElementById('panel');
nodes.handle = document.getElementById('sheet-handle');
nodes.canvas = document.getElementById('map');
sheetQuery = matchMedia('(max-width: 1000px)');
const stored = readStore();
if (stored) {
quiz.seed = stored.seed;
quiz.picks = stored.picks;
quiz.index = stored.index;
quiz.finished = stored.finished;
} else {
quiz.seed = newSeed();
quiz.picks = scenarios.map(function () { return null; });
}
quiz.perms = permutations(quiz.seed);
app.onFrame(tick);
document.addEventListener('keydown', onKey);
nodes.panel.addEventListener('click', onHandleClick, true);
const onSheet = function () { setWatching(player.active && sheetQuery.matches); };
if (sheetQuery.addEventListener) sheetQuery.addEventListener('change', onSheet);
}
XD.quiz = { init: init, open: open, start: start, pick: pick, next: next, state: state, playAll: playAll };
})();
(function () {
'use strict';
const XD = globalThis.XD || (globalThis.XD = {});
function boot() {
const query = new URLSearchParams(location.search);
const sim = XD.createSim(XD.layout, { seed: 7, warmup: 120 });
const headStart = Number(query.get('t'));
if (Number.isFinite(headStart) && headStart > 0) sim.run(Math.min(headStart, 120));
XD.ui.init({ sim: sim });
if (XD.quiz && typeof XD.quiz.init === 'function') XD.quiz.init({ sim: sim });
XD.ui.openFromLink();
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
})();
</script>
