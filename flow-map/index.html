const INFO = {
  door:{lane:&quot;DOCK DOOR&quot;,title:&quot;Dock door &amp; trailer&quot;,owner:&quot;Dock manager&quot;,
    what:[&quot;A trained associate releases the trailer to the dock before anyone works it, and every move starts with a door scan so the system knows which trailer is being unloaded.&quot;,&quot;Floor-loaded (fluid) trailers are hand-unloaded from inside the trailer straight onto a flex conveyor (lines 1 and 4). Palletized trailers are unloaded by forklift into the pallet zone right in front of the door (lines 2, 3, 5 and 6).&quot;],
    controls:[[&quot;Trailer release&quot;,&quot;nobody works a trailer until it is released to the dock&quot;,&quot;practice&quot;],[&quot;Freight type&quot;,&quot;fluid → unloaders + flex conveyor · pallets → forklift to the door's pallet zone&quot;,&quot;model&quot;],[&quot;Escalation&quot;,&quot;zones turn amber as they fill and red at capacity&quot;,&quot;model&quot;]],

    controls:[[&quot;Capacity&quot;,&quot;the positions drawn in the zone; amber when nearly full, red when full&quot;,&quot;anim&quot;],[&quot;Order&quot;,&quot;first in, first out — oldest and most urgent first&quot;,&quot;practice&quot;]],
    slides:[{title:&quot;Flex zone rules&quot;,bullets:[&quot;First in, first out&quot;,&quot;Receive pallets as they land so routing is known early&quot;,&quot;Zone full → stop sending pallet trailers to flex doors and escalate&quot;]}]},
  fork:{lane:&quot;FORKLIFT · PALLET UNLOAD&quot;,title:&quot;Forklift operator — pallet unload&quot;,owner:&quot;Dock manager · certified operators&quot;,
    what:[&quot;Forklift operators unload mixed pallets from the trailer into the pallet zone in front of that door.&quot;,&quot;The forklift works only inside the dock zone: along the lane between the doors and the zones, back into the trailer, and into the pallet zone or flex zone in front of that door. It never drives past the zone line into the depal, conveyor or cage areas. When every zone on its line is full it diverts the next pallet to a flex zone on its side.&quot;,&quot;Each move is scanned — the door first, then the pallet once it is set down — so the system knows where every pallet is.&quot;],
    controls:[[&quot;Travel&quot;,&quot;forklift lane + pallet zones only — never past the zone line&quot;,&quot;model&quot;],[&quot;Certification&quot;,&quot;every operator certified before live work&quot;,&quot;practice&quot;],[&quot;Pedestrian separation&quot;,&quot;marked forklift lanes; spotter at active stacking&quot;,&quot;practice&quot;],[&quot;Zone being worked&quot;,&quot;the forklift does not drop into the zone the flex conveyor is in&quot;,&quot;model&quot;]],
    slides:[{title:&quot;Pallet unload&quot;,bullets:[&quot;Scan the dock door&quot;,&quot;Drive into the trailer, pick the pallet&quot;,&quot;Set it down in the door's pallet zone, scan the pallet → unload done&quot;]},{title:&quot;Then hand off to receive&quot;,bullets:[&quot;An associate receives the pallet in the zone&quot;,&quot;The scanner returns where it goes — follow it&quot;,&quot;Mixed pallets → depalletize on this line · single-item pallets → straight to stow&quot;]}]},

    controls:[[&quot;Zone capacity&quot;,&quot;the positions drawn in the zone&quot;,&quot;anim&quot;],[&quot;Amber&quot;,&quot;nearly full → dock manager acts&quot;,&quot;model&quot;],[&quot;Red&quot;,&quot;door at capacity → forklift diverts to a flex zone&quot;,&quot;model&quot;],[&quot;Second thrower&quot;,&quot;joins when the line's zones pass half full&quot;,&quot;anim&quot;],[&quot;Forklift / depal separation&quot;,&quot;the forklift does not drop into the zone being worked&quot;,&quot;model&quot;]],

<script>const COL={dock:"#f08a4b",stow:"#3db4ea",sort:"#ffe14d",rwip:"#c75bd6",prob:"#ff5a5a",xd:"#3ec46d",empty:"#e6eef2",picked:"#f08a4b",mainaisle:"#5cbf3a",wrongsite:"#c43a3a",ddk:"#c75bd6",drev:"#ff2d6f",nra:"#3db4ea",tailsort:"#8fd3ff",palbuild:"#4aa3ff",dropzone:"#ffc94b",pjk:"#ff9f43",outlanes:"#ff8a3d",dmg:"#ff2d6f",st_ok:"#3ec46d",st_warn:"#ffc94b",st_bad:"#ff5a5a",st_wait:"#9fb0b8"};const PATHS=[{id:"dock",name:"Receive dock",group:"Receive",c:"dock",status:"ib",detail:"../dock-flow/",detailName:"Receive dock flow map — trailer to cage",detailNote:"Runs live inside the dock on this map, turned so the doors sit on the south wall; open it full screen for its guided tour."},{id:"wipStow",name:"Stow WIP (dock side)",group:"WIP lanes",c:"stow",status:"ib"},{id:"wipSort",name:"Sort WIP",group:"WIP lanes",c:"sort",status:"ib"},{id:"wipRpk",name:"Repack WIP",group:"WIP lanes",c:"rwip",status:"ib"},{id:"mainaisle",name:"Main aisle",group:"Aisles",c:"mainaisle",status:"ib"},{id:"sort",name:"Sort stations",group:"Stations",c:"sort",status:"ib"},{id:"rpk",name:"Repack stations",group:"Stations",c:"rwip",status:"ib"},{id:"cswap",name:"Cage swap",group:"Stow and pick",c:"stow",status:"ib"},{id:"nra",name:"Narrow-aisle racking · stow and pick",group:"Stow and pick",c:"nra",status:"ib"},{id:"empties",name:"Empty cages",group:"Stow and pick",c:"empty",status:"ib"},{id:"pickdz",name:"Pick drop zone",group:"Stow and pick",c:"picked",status:"ib"},{id:"probsv",name:"Problem solve",group:"Exceptions",c:"prob",status:"ib"},{id:"ddk",name:"Damage desk",group:"Exceptions",c:"ddk",status:"ib"},{id:"drev",name:"Damage review",group:"Exceptions",c:"drev",status:"ask"},{id:"wrongsite",name:"Wrong-site hold",group:"Exceptions",c:"wrongsite",status:"ib"},{id:"obwip",name:"Outbound WIP",group:"Outbound (phase 2)",c:"xd",status:"ob"},{id:"tailsort",name:"Tail sorters",group:"Outbound (phase 2)",c:"tailsort",status:"ob"},{id:"palbuild",name:"Pallet build",group:"Outbound (phase 2)",c:"palbuild",status:"ob"},{id:"dropzone",name:"Drop zone · middle island",group:"Outbound (phase 2)",c:"dropzone",status:"ob"},{id:"pjk",name:"Pallet jack lane",group:"Outbound (phase 2)",c:"pjk",status:"ob"},{id:"outlanes",name:"Outbound lanes",group:"Outbound (phase 2)",c:"outlanes",status:"ob"}];const TOUR=["dock","wipStow","cswap","nra","empties","pickdz","wipSort","sort","wipRpk","rpk","probsv","ddk","drev","wrongsite","mainaisle","obwip","tailsort","palbuild","dropzone","pjk","outlanes"];const INFO={dock:{lane:"RECEIVE · DOCK",title:"Receive dock — check-in, label scan, cage build",owner:"Receive lead",what:["The live receive dock flow map runs inside the dock here, turned so the doors sit on the south wall. Door numbers are left off. (model)","Floor-loaded trailers are fluid-unloaded: associates work the cases off the trailer face onto a flex conveyor that runs to the receive line. Freight that arrives on pallets is broken down at depal (DPL), where associates throw the cases onto the line. (model)","Every case is checked in at its line’s check-in station (CHK). Check-in is the slowest step on the line, so it sets the pace for the whole dock: watch the queue in front of it first. (practice)","A label scan (LBL) prints the sort label that sends each case to its placard: blue stow, yellow sort, purple repack, green cross-dock, red problem solve. Cases that arrive with no label go to problem solve too. (model)","Most cases go to stow; smaller shares go to repack, cross-dock, sort and problem solve. The mix drawn here is illustrative, not a real split. (model)","The dock unloads at the pace that keeps the cage swap fed without flooding it: stow sets the pace, not the trailer. (model)","Cage build at the end of each line: end-of-line associates on both sides put each case in a cage of its placard colour, and a cage is sealed when it is full, before it moves. (practice)","Each line’s end-of-line 5S also holds a purple-outlined repack WIP cage and a crimson damages cage. Damaged cases go in the damages cage; a full one goes straight to damage review. (model)","Sealed cages wait in the buffer along the dock’s north edge. The hand-over is pull, not push: a yard waterspider asks for the next cage, the dock releases the oldest, and the waterspider takes it to its WIP lane. (model)","Phase 1 (inbound only): the dock line nearest the outbound side does not unload trailers. It runs as the transfer-out lane: green cross-dock cages, and transfer-out totes and cages from sort and repack, come to its north end, an associate (OUT) throws the cases onto the line and they ride out to the trailer at its door. (model)","Phase 2 (outbound added): that line receives again, and cross-dock and transfer-out work goes to the outbound WIP and the induct conveyor instead. (model)"],controls:[["Unload","Paced to what stow can take, not to the trailer","model"],["Check-in","Every case · the step that sets the line’s pace","practice"],["Label scan","Every case · prints the sort label that picks its placard","practice"],["Cage build","One placard colour a cage · sealed when full, before it moves","practice"],["Cage WIP on the floor","Green · yellow · red bands · act at yellow, escalate at red","practice"],["Cage dwell","Oldest cage first · a long wait goes to the shift lead, a longer one to the manager","practice"],["Hand-over","Pull, not push · the yard asks for the next cage","model"],["Transfer-out lane","Phase 1: the line nearest the outbound side · Phase 2: it receives again","model"]],videos:[],photos:[],hint:"Click the dock to drive the live dock map in place, or open it full screen with the Open button for its guided tour."},wipStow:{lane:"WIP · STOW",title:"Stow WIP — dock side",owner:"Receive lead · Stow lead",what:["Sealed blue-placard stow cages park here straight out of cage build, in flow-through lanes: in at the dock end, out at the far end, so the oldest cage always leaves first. (model)","Stow takes the largest share of what the dock receives, so this is the busiest WIP on the floor. (model)","Tugger trains hook the cages along the cross aisle, take them up the east connector and along the main aisle to the cage swap banks, and bring empties back. (model)","When stow can’t keep up, cages back up here first. Watch this lane before the dock: once it is full, the dock has to hold its sealed cages. (practice)"],controls:[["Stow share","The largest share of the dock’s cases","model"],["Lanes","Flow-through · oldest cage out first","model"],["Cage WIP","Green · yellow · red bands","practice"],["At yellow","The shift lead checks stow pace and tuggers; a waterspider pulls the oldest cages","practice"],["At red","Escalate to the manager; move flex associates to stow; slow the unload","practice"]],videos:[],photos:[]},wipSort:{lane:"WIP · SORT",title:"Sort WIP",owner:"Receive lead",what:["Yellow-placard sort cages wait here for the sort stations: cases that hold several units and need sorting into totes. (model)","A small share of the dock’s cases, plus the sort cages that come back from the repack stations. (model)","A waterspider rolls each cage over the cross aisle to a station’s yellow sort WIP spot. (model)","Placard colours on this map: yellow = sort, red = problem solve, green = cross-dock and transfer out. Keep one colour scheme on the floor, on the placards and in every work instruction. (practice)"],controls:[["Sort share","A small share of the dock’s cases","model"],["Lane","Flow-through · oldest cage out first","model"]],videos:[],photos:[]},wipRpk:{lane:"WIP · REPACK",title:"Repack WIP",owner:"Receive lead",what:["Purple-placard cages wait here for the repack stations, where cases are prepped and re-labelled before they go on. (model)","Cases that arrive with no label go to problem solve, not here. (model)","Fed by the purple-outlined repack WIP cage in each dock line’s end-of-line 5S. (model)","A purple cage tops the lane up only if the dock’s purple share runs short. (anim)","A waterspider rolls each cage to the purple WIP spot at the end of a station pair. (model)"],controls:[["Lane","Flow-through · oldest cage out first","model"],["Top-up","Only when the dock’s purple share runs short","anim"]],videos:[],photos:[]},mainaisle:{lane:"AISLES · MAIN AISLE",title:"Main aisle",owner:"Receive lead · Waterspiders",what:["The green bar on the map: the main aisle. It runs between the cage swap banks and the sort stations, and on east to the outbound side. (model)","Two-way and wide enough for cages, tote carts and empty cages to pass each other. (model)","Keep right: westbound traffic runs on the north half, eastbound on the south half. Nothing parks, stages or queues on the main aisle. (practice)","Tuggers bring stow cages up it to the cage swap; waterspiders bring picked cages back down it to sort, to the outbound WIP in phase 2, or to the transfer-out lane in phase 1. (model)","Where two movers cross, the one crossing gives way. (anim)","Flow lines and carts use the main aisle, the cross aisle and the two connectors; nothing cuts through a station. (anim)"],controls:[["Traffic","Two-way · keep right","practice"],["Staging","None on the main aisle","practice"],["Crossings","The one crossing gives way","anim"]],flowIn:"Joins the west and east connectors, down to the cross aisle and the dock, and runs on east to the outbound side. (model)",flowOut:"An aisle, not a stop: tuggers and waterspiders carry the cages along it. (model)",videos:[],photos:[],hint:"Zoom in to watch the keep-right traffic: tugger trains, waterspiders and empty cages pass each other without stopping on the aisle."},sort:{lane:"STATIONS · MANUAL SORT",title:"Sort stations",owner:"Sort lead",what:["A row of manual sort stations along the main aisle, back to back with the repack stations. Each has a 5S row of cage spots on the aisle side: sort WIP (yellow), transfer out (green), empty totes (white), problem solve (red). (model)","The associate stands on the mat at a sort table with a scanner and monitor, tote racks on either side. The green tote on the rack beside the table takes the second sort. (model)","Sort cage in from sort WIP → cases scanned and sorted to totes → full totes to the transfer-out spot (green: to the transfer-out lane in phase 1, to the outbound WIP in phase 2); problem cases to the red problem solve cage. (model)","In phase 2 the stations at the east end also take picked cages from the pick drop zone. (model)","Damaged cases go in the red problem solve cage; problem solve passes them on to damage review. (model)","Watch the empty-tote spot: a station with no empty totes stops sorting. (practice)"],controls:[["Sort","Every case scanned to its destination tote","practice"],["Totes","Full totes to transfer out · empties from the white spot","model"],["Problem cases","Into the red cage, never left on the table","practice"],["Picked cages","Phase 2 only","model"]],videos:[],photos:[],hint:"Zoom in on a station and click its 5S spots for what each cage is for."},rpk:{lane:"STATIONS · REPACK",title:"Repack stations",owner:"Repack lead",what:["Repack stations sit head to head with the sort stations, facing the cross aisle: white tables with a purple edge, scanner, monitor, label printer and bubble wrap. (model)","Each pair of stations shares a row of 5S spots: WIP · stow · sort for the west station, problem solve and transfer out shared in the middle, sort · stow · WIP for the east one. (model)","Cases come in on the purple WIP cage, are prepped and re-labelled, and leave by placard: blue to the cage swap, yellow to sort WIP, red to problem solve, green to the transfer-out lane (phase 1) or the outbound WIP (phase 2). (model)","For each unit the associate looks up the item and its purchase order, applies a new label and routes it. (practice)","A station works its whole WIP cage before it takes the next one. (anim)","Damaged cases go in the red problem solve cage; problem solve passes them on to damage review. (model)"],controls:[["Each unit","Look up, re-label, route by placard","practice"],["WIP cage","Worked to empty before the next","anim"],["Problem cases","Into the shared red cage","model"]],videos:[],photos:[]},cswap:{lane:"STOW · CAGE SWAP",title:"Cage swap",owner:"Stow lead",what:["Stow swap banks sit at the racking mouth, each with a lift parking spot beside it, off the travel lane along the aisle ends. In each bank the white columns next to the parking spot take empties and the blue columns hold full stow cages. (model)","The order picker drives in along the lane and parks sideways in its spot; the operator rolls the empty off into a white column and the oldest full cage onto the forks, then drives it up a narrow aisle. (model)","A cage is stowed to empty: the operator stows every case in it, case by case, before heading back to the swap. (model)","Stow is one-piece flow: the operator scans the cage at the swap, then each case and the bin it goes in. (practice)","Any stow spot does the whole changeover (the empty off, a full on); the first lift that can still turn in takes the spot that comes free. (model)","Swap time runs from the last case stowed out of the old cage to the first case stowed out of the new one. Time a lift spends waiting at the swap is time nothing is stowed. (practice)","When there are more lifts than swap spots they queue by the swap, and an amber outline marks a lift waiting for a spot. The queue is drawn as it is: it shows why the number of swap spots matters as much as the number of drivers. (model)","A case that can’t be stowed goes back in its cage with a red placard, for problem solve. (model)","Damaged cases found at stow go in the crimson damages cage at the west end of the swap banks; problem solve takes it from there. (model)","Watch the swap: if lifts back up here, the cage buffer fills, the tugger routes jam and the dock backs up behind them. A backup that lasts goes to the shift lead. (practice)"],controls:[["Stow","One-piece flow · each case scanned to its bin","practice"],["Swap backup","A lasting queue → the shift lead finds out why","practice"],["Design","Each swap spot does the whole changeover","model"],["Stow staffing","Stowers sized to what the dock receives","model"],["Lifts drawn","Enough to keep the flow moving","anim"],["Swap time","Last stow in the old cage to the first stow in the new","practice"],["Queue","Drawn as it is, never hidden","model"]],videos:[],photos:[]},nra:{lane:"STOW · NARROW-AISLE RACKING",title:"Narrow-aisle racking — stow and pick",owner:"Stow lead · Pick lead",what:["Stow lands in the narrow-aisle racking north of the cage swap. (model)","Stow and pick run on order pickers: the operator rides the platform up to the bay and moves cases one at a time. The blue bar on each lift shows its platform height. (anim)","In some aisles a stower works its whole cage in view, bay by bay; in the others a lift comes into view near the end of a cage. The +n beside the aisles counts lifts working out of view. (anim)","Order pickers bring picked cages back out to the pick drop zone and take an empty from the bank beside it. (model)","Controlled fill: fill a bay before the next one opens, so stow stays dense and pickers travel less. (practice)","Pallet stow, where it is used, needs wider aisles and its own trucks; this map animates stowing and picking cases only. (model)"],controls:[["Stow in the aisle","One case at a time, platform raised to the bay","anim"],["Bay fill","Fill a bay before the next opens","practice"],["Lifts out of view","Counted by the +n beside the aisles","anim"]],videos:[],photos:[],hint:"Zoom in on the aisles in view to watch a whole cage go into the racking, case by case."},empties:{lane:"CAGES · EMPTY RETURN",title:"Empty cages",owner:"Receive lead · Waterspiders",what:["Stowers drop each empty at the spot they swap at, in the bank’s white columns; tuggers hook them off after their drops and take them down the west connector, back to the dock for cage build. (model)","The second empty bank, beside the pick drop zone, supplies the pickers: they take an empty when they drop a picked cage. Stowers restock it when it runs low. (model)","Placards and scanners are staged at startup, so nobody travels to the swap for an empty cage. (practice)","Watch the cage count: too few empties coming back and the dock runs out of cages to build into. (practice)"],controls:[["Cage count at the swap","Checked on a fixed cycle through the shift","practice"],["Escalation","Running short of empties → the manager, before cage build stops","practice"]],videos:[],photos:[]},pickdz:{lane:"PICK · DROP ZONE",title:"Pick drop zone and picked cages",owner:"Pick lead",what:["Order pickers park in the pick swap spot and drop picked cages on the orange bank, then take an empty from the bank beside it. (model)","Waterspiders take picked cages down the main aisle to the sort stations, or (phase 2) straight to the outbound WIP when they don’t need sorting. (model)","Phase 1 (inbound only): every picked cage goes down the east connector to the transfer-out lane. Phase 2: to the east-end sort stations or the outbound WIP. (model)","Damaged cases found at pick go in the crimson damages cage at the east end of the drop zone; problem solve takes it from there. (model)","There is one picker swap spot: as pick volume grows, pickers queue for it. (model)"],controls:[["Drop zone dwell","Oldest cage out first · a set limit on how long a cage may wait","practice"],["Picked cages","Moved on in time for their truck cut-off","practice"]],videos:[],photos:[]},probsv:{lane:"EXCEPTIONS · PROBLEM SOLVE",title:"Problem solve",owner:"Problem solve lead",what:["Red-placard cages come here from the dock (problem cases and every case with no label), from the sort and repack stations’ red spots, and with unstowable cases from the cage swap. (model)","A pair of red cage banks with a problem solve station between them; a waterspider brings the oldest cage over to the table. (model)","Investigate, then re-route or set aside: a case that scans goes back to stow; one that can’t be scanned or is damaged becomes an exception; a not-processable item is quarantined until someone decides what happens to it. (practice)","Resolved cases go in a cage of their placard colour and go back: yellow to sort WIP, blue to the nearest stow WIP lane, green to the transfer-out lane (phase 1) or the outbound WIP (phase 2). (model)","Damaged cases from stow, pick, sort and repack go on to damage review in a damages cage along the crimson line; a work cage still holding damaged cases goes to the damage desk. (model)","Escalate quarantined items that are not moving: each needs an owner and a decision. (practice)"],controls:[["Not processable","Quarantined until a decision · a long wait goes to the manager","practice"],["Resolved cases","Back by placard colour","model"],["Damages","On to damage review","model"]],videos:[],photos:[]},ddk:{lane:"EXCEPTIONS · DAMAGES",title:"Damage desk",owner:"Problem solve lead",what:["Damages found after receive are worked here with a damage check, case by case. (practice)","A pair of damage desk stations, a cage bank and gaylords for disposition. An associate (DD) takes a damaged case from the cages, checks it at the table and drops it in a disposition gaylord. (model)","Problem solve associates rotate into the damage desk as needed. (practice)","A full gaylord is swapped for an empty one. (anim)"],controls:[["Damages","Tracked so damage stays low and keeps trending down","practice"],["Gaylords","Swapped when full","anim"]],videos:[],photos:[],flowOut:"Worked case by case at the damage check tables into the gaylords for disposition; an emptied cage goes back into the dock. (model)"},drev:{lane:"EXCEPTIONS · DAMAGES",title:"Damage review",owner:"Problem solve lead",what:["Every damaged case on the floor ends here. Crimson damages cages come straight from the receive dock’s end of line and from the outbound dock, and through problem solve from stow, pick, sort and repack. (model)","Laid out like problem solve: the review associate (DR) works the inbound cages one at a time at a damage check table and sorts each case to its destination. (model)","In phase 2 a second work spot (DR2) opens when the inbound row backs up, worked by a flex associate, and closes again when the row drains. (model)","While every inbound spot is taken, the dock holds its damages cages in its buffer: watch this row, not the dock. (model)","Damages are drawn far more often than they really happen, so there is something to watch. (anim)","Destinations, containers and the sellable / unsellable split are still open; the map draws work cages, gaylords and pallet spots. (model)"],controls:[["Review associate","Flex help in phase 2 when the queue backs up","model"],["Damages in","From every area, by source","model"],["Drawn rate","Far above real, for the animation","anim"]],videos:[],photos:[],flowOut:"Sorted case by case at the damage check table to its pallets and gaylords; where those go next is still open. (model)"},wrongsite:{lane:"EXCEPTIONS · WRONG-SITE HOLD",title:"Wrong-site hold",owner:"Receive lead",what:["The red block on the map: items that arrive here but belong to another building. (model)","Pulled off the dock and held here, apart from site inventory, so they are never received or stowed by mistake. (practice)","Where they go from the hold is still open; on the map the oldest goes back into the dock at its west edge. (model)"],controls:[["Hold","Apart from site inventory · never received","practice"],["Escalation","A hold that keeps growing → the shift lead","practice"]],videos:[],photos:[],flowOut:"Held here, apart from site inventory; where wrong-site items go from the hold is still open. (model)"},obwip:{lane:"OUTBOUND · WIP",title:"Outbound WIP",owner:"Outbound lead",what:["Green cage spots along the outer side of each induct run, opposite the diverters: two columns per gravity lane, two deep. (model)","Phase 2: filled by green cross-dock cages from the receive dock, transfer-out totes from the sort stations and repack, and picked cages that don’t need sorting. (model)","Phase 1 (inbound only): this work goes to the transfer-out lane on the receive dock instead. (model)","Induct associates throw each cage’s cases onto the induct conveyor; the empty cage nests beside its group and a waterspider takes the nest back to the receive dock. (model)","Damaged cases at the outbound dock go in the crimson damages cage at each end of the WIP row; a full one goes to damage review. (model)","Watch the front of each column: an induct associate with no cage in front of them means the row is starved; a full row means the sorter is the bottleneck. (practice)"],controls:[["Cross-dock","Straight to the outbound side in phase 2","model"],["Phase 1","Cross-dock and transfer out go to the transfer-out lane","model"]],videos:[],photos:[]},tailsort:{lane:"OUTBOUND · TAIL SORTERS",title:"Tail sorters",owner:"Outbound lead",what:["Two tail sorters, mirrored, their U-turns facing each other. (model)","The pair sits right next to the receive dock, each sorter only as long as its gravity lanes; the outbound lanes keep their place along the outbound dock. (model)","Induct associates put cases on the induct run; a label scan associate (LBL) at each sorter’s scanner scans each case, and a pusher (PSH) at each diverter pushes it down its gravity lane. (model)","Cross-dock path: cage → sorter → pallet build → stage → load. (practice)","The belt runs in bursts: cases go on a cage at a time as cages reach the WIP, and between cages the scan associate and the pushers stand by. (anim)"],controls:[["Label scan","Every case read before the diverters","practice"],["Scan associate","At each sorter’s scanner","model"],["Diverter pushers","At each gravity lane","model"],["Sorters","Phase 2 only","model"]],videos:[],photos:[]},palbuild:{lane:"OUTBOUND · PALLET BUILD",title:"Pallet build — one pallet per destination",owner:"Outbound lead",what:["Eac <script>(()=>{const WALKS={dock:{stops:[{t:"Receive dock: doors and lines",at:"path:dock",dk:"unl1a",cap:"The animated receive dock runs inside the map here, turned so its doors sit on the south wall. Fluid trailers are unloaded case by case onto a flex conveyor; pallet loads come off by forklift to depal. (model · anim)"},{t:"Check-in at the ball transfer table",at:"dock:table3|path:dock",dk:"table3",cap:"Cases ride the line onto a ball transfer table, where check-in scans every case. It is often the slowest step on a line: when cases pile up on the table, help check-in first. (model · practice)"},{t:"Label scan: the sort label",at:"dock:label3|path:dock",dk:"label3",cap:"The label scan prints the sort label that sends each case to its placard colour: blue stow, yellow sort, red problem solve and no-label, green cross-dock. (model)"},{t:"Cage build and the end of line",at:"dock:build3|path:dock",dk:"build3",cap:"Each case goes into the cage its label calls for, filled evenly and sealed before it moves. The end of line also holds a purple repack WIP cage and a red damages cage, sent to damage review when full. (model)"},{t:"Full-cage buffer and pick-up",at:"dock:buffer|path:dock",dk:"buffer",cap:"Sealed cages wait in the buffer along the dock’s north edge. A yard waterspider asks for the next one, oldest first, and takes it to its WIP lane. A full buffer stops cage build, so keep cages moving. (model · practice)"},{t:"Out the north edge: where cages go",at:"zone:yard-strip+line:d-stow1+line:d-stow2+line:d-stow3+line:d-rpk+line:d-sort+line:d-ps+line:d-xdw+line:d-xde",cap:"Blue cages go to the stow WIP lanes, purple to repack WIP, yellow to sort WIP, red (problem and no-label cases) to problem solve, and green to cross-dock. (model · anim)"},{t:"Phase 1: the transfer-out lane",at:"slot:TXO+dock:xfrlane|path:dock",dk:"xfrlane",ob:0,cap:"Phase 1, Outbound off: the dock’s east line stops unloading and becomes the transfer-out lane. Cross-dock cages, transfer-out pallets and picked cages come to its north end and are loaded out to its trailer. (model · anim)"},{t:"Open the full dock map",at:"path:dock",full:1,cap:"Want more detail? Open the full dock map, trailer to cage, with its own guided tour. (model)"}]},wipStow:{stops:[{t:"Stow WIP lanes",at:"zone:yard-stow1+zone:yard-stow2+zone:yard-stow3",cap:"Sealed blue stow cages park here straight out of cage build. Stow takes the bulk of inbound, so these lanes see the most traffic. (model · practice)"},{t:"Oldest leaves first",at:"zone:yard-stow1",cap:"Cages go in at the dock end and leave at the cross-aisle end, so the oldest leaves first and no cage passes another. Keep build-to-stow time short: an old cage at the front means stow is behind. (anim · practice)"},{t:"Tugger pick-up",at:"zone:yard-xaisle+zone:yard-stow1+zone:yard-stow2+zone:yard-stow3",cap:"Tugger trains run east on the south half of the cross aisle. The driver pulls each cage out of a lane’s north end and hooks it on. (model · anim)"},{t:"Up to the cage swap",at:"zone:yard-econ+zone:yard-ave+zone:cw-s1+zone:cw-s2",cap:"Then up the east connector and west along the main aisle’s north half to the cage swap’s stow banks. (model · anim)"},{t:"Watch these lanes first",at:"zone:yard-stow1+zone:yard-stow2+zone:yard-stow3",cap:"When stow can’t keep up, cages back up here before anywhere else, so check these lanes before the dock. If they keep filling, tell the shift lead and move people to stow early. (practice)"}]},cswap:{stops:[{t:"The cage swap",at:"path:cswap",cap:"Stow swap banks sit off the lift travel lane, each with a parking spot for an order picker beside it: white spots for empty cages, blue spots for full stow cages. (model)"},{t:"Full cages arrive",at:"zone:yard-ave+line:s-cw1+line:s-cw2+line:s-cw3+line:rpk-stow",cap:"Tuggers bring blue stow cages west on the main aisle’s north half and push them into the blue columns of the swap banks. Repack’s blue cages come here too. (model · anim)"},{t:"T1–T3: the whole swap at any spot",at:"zone:cw-t1+zone:cw-t2+zone:cw-t3+line:cw-nra0+line:cw-nra1+line:cw-nra2",cap:"Back from the racking, the order picker parks at whichever stow spot is free. Its operator rolls the empty into the white columns and the oldest full cage onto the forks. (model · anim)"},{t:"Waiting for a stow spot",at:"zone:cw-t1+zone:cw-t2+zone:cw-t3+zone:cw-lane",cap:"With every stow spot busy, lifts wait nose to tail on the north line; the first that can still turn in takes the spot that comes free. (model · anim)"},{t:"When the lane backs up",at:"zone:cw-lane+zone:cw-s1+zone:cw-s2",cap:"A short queue here is normal. A long one backs up the stow WIP lanes, the tugger runs and then the dock, so flag it to the shift lead early rather than wait for it to clear. (practice)"},{t:"Red placard: to problem solve",at:"zone:yard-e1|zone:cw-e1+line:cw-ps",cap:"A cage still holding a case that can’t be stowed goes into E1 with a red placard. A waterspider takes it down the west connector to problem solve. (model · anim)"},{t:"Red damages cage",at:"slot:CWDMS|zone:cw-t1+line:cw-dps|line:cw-ps",k:24,cap:"Damaged cases go in the red damages cage west of T1, walked over during the swap. A waterspider takes it to problem solve, then on to damage review. (model · anim)"},{t:"Swap time",at:"zone:cw-swt|zone:cw-lane",cap:"Swap time runs from the last case stowed from the old cage to the first from the new one. The readout above the lane times each swap, and an amber outline marks a lift that is waiting. (model · anim)"}]},nra:{stops:[{t:"Narrow-aisle racking",at:"path:nra",cap:"Stow lands in the narrow-aisle racking north of the cage swap. Cases are stowed and picked from order pickers that lift the operator up to each bay. (model)"},{t:"The narrow aisles",at:"zone:cw-nra",cap:"Order pickers run guided down aisles only a little wider than the truck, so it is one truck to an aisle, and nobody walks into an aisle while one is working in it. (practice)"},{t:"Who uses which aisle",at:"line:cw-nra0+line:cw-nra1+line:cw-nra2+line:mt-nra+line:nra-pk",cap:"Stowers use any of the west aisles, whichever stow spot they swapped at; pickers work the east aisles. (anim)"},{t:"Stow up the aisle",at:"line:cw-nra0+line:cw-nra1+line:cw-nra2",cap:"The order picker scans the cage and stows its cases one at a time, rising to each bay, then heads back. The blue bar shows its platform height. Some aisles keep a whole cage in view. (model · anim)"},{t:"Fill one bay before the next",at:"zone:cw-nra",cap:"Fill a bay well before opening the next one, and keep case and pallet storage in balance, so space isn’t stranded and pick paths stay short. (practice)"},{t:"Pick in the east aisles",at:"line:nra-pk+line:mt-nra+zone:cw-t4",cap:"Pickers take an empty cage from E2, pick into it in the east aisles and bring it out to the pick drop zone. (model · anim)"},{t:"Back out to the cage swap",at:"zone:cw-lane+line:nra-mt+line:nra-pk",cap:"Lifts come back out along the lane: stowers swap at any free stow spot, some dropping an empty at T4 first, and pickers drop the picked cage at T4. (anim)"}]},empties:{stops:[{t:"Where the empties wait",at:"path:empties",cap:"Empty cages wait in the white columns of the stow swap banks, for tuggers to take back to the dock for cage build, and on E2 by the pick drop zone for the pickers. (model)"},{t:"The stow drop, at any stow spot",at:"zone:yard-e1|zone:cw-e1+zone:cw-t1+zone:cw-t2+zone:cw-t3",cap:"The stow lift parks at any free stow spot and its operator rolls the empty into the two white columns next to it, from the north. (model · anim)"},{t:"Tuggers hook them off",at:"zone:yard-e1|zone:cw-e1+zone:cw-s1+zone:cw-s2+zone:yard-ave",cap:"Tugger trains run west on the main aisle’s north half, drop their stow cages, then hook the empties off the south ends of the white columns. (model · anim)"},{t:"Back to the dock for cage build",at:"zone:yard-wcon+line:mt-dock+zone:yard-strip",cap:"Tuggers bring the empties down the west half of the west connector, along the cross aisle and back to the dock floor strip, where the dock builds them into new cages. (model · anim)"},{t:"E2: empties for the pickers",at:"zone:cw-e2+zone:cw-t4",cap:"E2, beside the pick drop zone, supplies the pickers. Stow lifts restock it from T4 when it runs low, or when the white columns at their stow spot are full. (model · anim)"},{t:"The picker takes an empty",at:"zone:cw-e2+zone:cw-t4+line:mt-nra",cap:"When a picker drops a picked cage at T4, its operator rolls an empty from E2 onto the forks, and the picker heads back up an east aisle. (anim)"},{t:"Staged at shift start",at:"path:empties",cap:"Stage placards and scanners at shift start so nobody leaves a station to hunt for an empty. Count empty cages through the shift and tell the manager early when they run short. (practice)"}]},pickdz:{stops:[{t:"Pick drop zone",at:"path:pickdz",cap:"Order pickers park at the pick spot and drop picked cages on the orange bank, to be sorted or sent out. It works like a stow swap. (model)"},{t:"T4: the pick spot",at:"zone:cw-t4",k:24,cap:"Pickers back into T4 from the east. Stow lifts also pull in from the west to drop empties on E2 for them. (anim)"},{t:"Swap: picked cage off, empty on",at:"zone:yard-p|zone:cw-p+zone:cw-t4+zone:cw-e2",cap:"The operator steps off, rolls the orange-placard picked cage into P from the north, then rolls an empty from E2 onto the forks. (model · anim)"},{t:"P: picked cages wait",at:"zone:yard-p|zone:cw-p",cap:"Picked cages wait on P and leave its south end onto the main aisle. Keep them moving: when P is full, the pickers have nowhere to drop. (model · practice)"},{t:"Red damages cage for pick damages",at:"slot:PKDMS|zone:yard-p+line:pk-dps",k:24,cap:"Damaged picked cases go in the red damages cage just east of P. A waterspider takes it to problem solve, then on to damage review. (model · anim)"},{t:"Phase 2: to sort",at:"line:pk-sort+zone:sort-11-wip+zone:sort-12-wip",ob:1,cap:"Phase 2, Outbound on: sort waterspiders take picked cages that need sorting to the two east-end sort stations. (model · anim)"},{t:"Phase 2: to the Outbound WIP",at:"line:pk-xd+zone:ob-wip-W+zone:ob-wip-E",ob:1,cap:"Picked cages that don’t need sorting go east on the main aisle’s south half, straight to the Outbound WIP. (model · anim)"},{t:"Phase 1: to the transfer-out lane",at:"zone:yard-econ+slot:TXO+line:pk-esc",ob:0,cap:"Phase 1, Outbound off: every picked cage goes down the east connector to the transfer-out lane at the dock, and its trailer takes them out. (model · anim)"}]},wipSort:{stops:[{t:"Sort WIP lane",at:"zone:yard-sort|zone:sort-wipsort1",cap:"Yellow sort cages wait here for the sort stations: cases holding several units, which are sorted into totes before they can be stowed. (model)"},{t:"In from the dock and repack",at:"zone:yard-sort|zone:sort-wipsort1+line:d-sort+line:rpk-sort",cap:"Cages go in at the dock end, from the dock lines and from repack along the dock strip, and leave at the cross-aisle end. (model · anim)"},{t:"Over to a station",at:"line:w-sort+zone:sort-08-wip",cap:"When a station is nearly out of work, a waterspider takes a full cage west on the cross aisle, up the west connector and east on the main aisle to it. (model · anim)"},{t:"Placard colours",at:"zone:yard-sort|zone:sort-wipsort1",cap:"Yellow is sort, red is problem solve, green is cross-dock or transfer out. Use one colour scheme everywhere, so anyone can move a cage without reading its label. (practice)"},{t:"Reading the lane",at:"zone:yard-sort|zone:sort-wipsort1",cap:"A full lane means the stations are short of people or totes, and yellow cages will soon back up into the dock buffer: tell the shift lead early. An empty one means stations will soon stand idle. (practice)"}]},sort:{stops:[{t:"Sort stations: the whole path",at:"path:sort",cap:"Sort stations line the main aisle, back to back with repack: yellow cages in, cases sorted into totes, full totes out. (model)"},{t:"The run to the station",at:"zone:yard-sort|zone:sort-wipsort1+line:w-sort+zone:sort-08-wip",cap:"When a station’s cage is nearly empty, a waterspider brings a full one from sort WIP west along the cross aisle, up the west connector and east along the main aisle. (model · anim)"},{t:"The four 5S spots",at:"zone:sort-08-wip+zone:sort-08-to+zone:sort-08-et+zone:sort-08-ps",k:24,cap:"Four 5S spots face the main aisle: sort WIP (yellow), transfer out (green), empty totes (white) and problem solve (red). Each has a marked home, so a gap shows at a glance. (model · practice)"},{t:"The associate scans and sorts",at:"zone:sort-08",k:24,cap:"An associate on the anti-fatigue mat takes a case from the sort WIP cage, scans it and sorts its units into totes on the racks either side of the table. (model · anim)"},{t:"Transfer out and empty totes",at:"zone:sort-08-to+zone:sort-08-et",k:24,cap:"Full totes stack on a plastic pallet at transfer out. For every full tote the associate moves there, they take an empty one from empty totes. (model · anim)"},{t:"Problem cases and damages",at:"zone:sort-08-ps+line:sort-ps",k:24,cap:"Problem, no-label and damaged cases go in the red problem-solve cage. A waterspider takes it to problem solve, and the emptied sort WIP cage becomes the new red cage. (model · anim)"},{t:"Phase 1: out to the transfer-out lane",at:"zone:sort-08-to+line:sort-esc+slot:TXO",ob:0,cap:"Phase 1, Outbound off: a pallet jack waterspider takes each full transfer-out pallet east on the main aisle and down the east connector to the transfer-out lane. (model · anim)"},{t:"Phase 2: to the Outbound WIP",at:"zone:sort-08-to+line:sort-xd+slot:XBWIPW",ob:1,cap:"Phase 2, Outbound on: full transfer-out pallets go into the Outbound WIP from the north, and the pallet jack brings back a pallet of empty totes. (model · anim)"}]},wipRpk:{stops:[{t:"Repack WIP lane",at:"zone:yard-rpk|zone:rpk-wip1",cap:"Purple-placard cages wait here for the repack stations: items that need checking, protecting or relabelling before they can be stowed. No-label cases go to problem solve, not here. (model)"},{t:"Fed from the dock",at:"dock:cage1_1|dock:build1|path:dock+line:d-rpk+zone:yard-rpk|zone:rpk-wip1",dk:"cage1_1.pc-purple|build1",cap:"Each dock line’s end of line fills a purple repack WIP cage. Once sealed it waits in the dock buffer like any other cage, then a waterspider brings it here. (model · anim)"},{t:"To the station pair",at:"zone:yard-rpk|zone:rpk-wip1+line:w-rpk+zone:rpk-pair2",cap:"A waterspider takes each cage out of the lane’s north end and pushes it into a station pair’s purple WIP spot from the cross aisle. (model · anim)"},{t:"Watch the lane",at:"zone:yard-rpk|zone:rpk-wip1",cap:"Repack is slow, careful work. If this lane keeps filling, add hands at the stations or tell the shift lead before purple cages back up into the dock. (practice)"}]},rpk:{stops:[{t:"Repack stations: the whole path",at:"path:rpk",cap:"Repack stations sit head to head with the sort stations, in pairs facing the cross aisle. Purple WIP cages come in; items leave by placard colour. (model)"},{t:"The WIP swap at a pair",at:"zone:rpk-pair2+line:w-rpk",cap:"A waterspider pushes a full purple cage into a WIP spot from the cross aisle. The emptied cage takes a free output spot or goes back to the dock. (model · anim)"},{t:"Repack at the table",at:"zone:rpk-pair2",k:24,cap:"At the table the associate looks up each item, wraps it if it needs protecting, then labels it and routes it to the spot for its placard colour. (model · anim)"},{t:"The pair’s 5S spots",at:"zone:rpk-pair2",k:24,cap:"A pair shares one row of 5S spots: WIP, stow and sort for each station, with problem solve and transfer out shared in the middle. (model · anim)"},{t:"Out: stow and sort",at:"slot:S1+slot:S2+zone:yard-sort|zone:sort-wipsort1+line:rpk-stow+line:rpk-sort",cap:"Full blue stow cages go by the cross aisle, west connector and main aisle to the stow swap banks; yellow sort cages go along the dock strip into sort WIP. (model · anim)"},{t:"Out: problem solve and damages",at:"slot:PSA+slot:PSB+line:rpk-ps",cap:"Problem items and damages go in the shared red problem-solve cage. When it is full, a waterspider takes it west on the cross aisle into a problem-solve bank. (model · anim)"},{t:"Phase 1: out to the transfer-out lane",at:"zone:rpk-pair2+line:rpk-esc+slot:TXO",ob:0,cap:"Phase 1, Outbound off: full green transfer-out cages go down a gap and along the dock strip to the transfer-out lane. (model · anim)"},{t:"Phase 2: to the Outbound WIP",at:"zone:rpk-pair2+line:rpk-xd+slot:XBWIPW",ob:1,cap:"Phase 2, Outbound on: they go along the dock strip, up the east connector and across the link into the Outbound WIP. (model · anim)"}]},probsv:{stops:[{t:"Red cages come in",at:"zone:ex-psA+zone:ex-psB+line:d-ps+line:sort-ps+line:rpk-ps+line:cw-ps",cap:"Red-placard cages come in: problem and no-label cases from the dock, the red spots at sort and repack, and cases the cage swap couldn’t stow. (model)"},{t:"Damages from stow and pick",at:"slot:CWDMS+slot:PKDMS+line:cw-dps+line:pk-dps|line:cw-ps",cap:"Damaged stow and pick cases go in red damages cages at the cage swap and by the pick drop zone. The red lines bring them here; problem solve passes them on to damage review. (model)"},{t:"Waiting banks",at:"zone:ex-psA+zone:ex-psB",cap:"Red cages wait in two banks with the problem-solve station between them: in from the cross aisle at the north end, oldest out of the south end. Full banks mean problem solve needs help. (model · practice)"},{t:"Work spots",at:"zone:ex-psw",k:10,cap:"A problem-solve waterspider pulls the front cage into one of two work spots behind the mat, so the next is ready while the problem solver works the other. (anim)"},{t:"Problem-solve station",at:"zone:ex-psst",k:10,cap:"The problem solver scans each case at the table, then re-routes it or sends it for disposition. Cases that can’t be scanned or are damaged become exceptions; items that are not processable are quarantined. (practice · anim)"},{t:"Resolved cages",at:"zone:ex-psr",k:10,cap:"Fixed cases go in a cage by placard colour: yellow sort, blue stow, green cross-dock. A full cage is sealed for a waterspider to take on. (anim)"},{t:"Out of problem solve",at:"zone:ex-psout+zone:yard-sort+zone:yard-stow1+slot:TXO",cap:"Full cages go yellow to sort WIP, blue to a stow WIP lane, and green to the transfer-out lane in phase 1 or to the Outbound WIP in phase 2. (model · anim)"},{t:"Damages: on to the damage desk or damage review",at:"zone:ex-psw+line:ps-ddk+line:ps-rv+zone:ex-ddkc+slot:RVPS|path:drev",cap:"Damaged cases stay in the work cage, which goes down to the damage desk’s cages, or the problem solver walks them over to damage review. (model · anim)"}]},ddk:{stops:[{t:"Damage desk",at:"path:ddk",cap:"The damage desk works damaged cases found after receive, with a damage check that decides what happens to each one. (model)"},{t:"In from problem solve",at:"line:ps-ddk+zone:ex-ddkc",cap:"A problem-solve waterspider pushes a work cage still holding damaged cases down from problem solve into one of the damage desk’s cage spots. (anim)"},{t:"Damage-check tables",at:"zone:ex-ddk1+zone:ex-ddk2",k:10,cap:"Each associate takes one case from the nearest cage and works it at a damage-check table: sellable as it is, fit to repack, or for disposition. (model · practice)"},{t:"Disposition gaylords",at:"zone:ex-ddkg",k:10,cap:"Each worked case goes into a disposition gaylord, and a full gaylord is swapped for an empty one. Most damage starts with handling upstream, so share what you see here with those areas. (practice · anim)"},{t:"Empties back to the dock",at:"zone:ex-ddkc+slot:RVIN",cap:"An emptied cage is pushed out south of the damage desk, then east below damage review and back into the dock at its west edge. (anim)"}]},drev:{stops:[{t:"Damage review",at:"path:drev",cap:"Damaged cases from almost every area end up here. It is laid out like problem solve: an associate works the red cages one at a time at a damage-check table. (model)"},{t:"Straight from the docks",at:"line:d-rv|path:drev+line:ob-rvW+line:ob-rvE+slot:XBDMSW+slot:XBDMSE",ob:1,cap:"Red damages cages come straight here from each receive dock line’s end of line and, in phase 2, from the Outbound WIP’s damages spots, along the red lines. (model)"},{t:"Inbound row",at:"slot:RVIN|path:drev+line:d-rv",k:10,cap:"Cages from the docks arrive at the dock’s west edge and go into the inbound row, in at the east end. The oldest is worked first. (anim)"},{t:"By way of problem solve",at:"slot:RVPS+line:ps-rv|path:drev",k:10,cap:"Stow, pick, sort and repack damages reach problem solve first. The problem solver hands those cases into this red cage, problem solve’s damages cage. (model)"},{t:"Work cages",at:"slot:RVWC|path:drev",k:10,cap:"The associate brings the next cage, from the inbound row or problem solve’s damages cage, into one of two work spots behind the mat. One is worked at a time. (model · anim)"},{t:"Damage-check table",at:"slot:RVST|path:drev",k:10,cap:"At the table the associate checks each case, decides what happens to it, then carries it to its destination. (model)"},{t:"Destinations",at:"slot:RVP+slot:RVG|path:drev",k:10,cap:"Cases are sorted by outcome onto destination pallets and into gaylords. Keep every destination clearly marked, so a damaged case never slips back into sellable stock. (model · practice)"},{t:"Phase 2: a second table",at:"slot:RVST2+slot:RVWC2|path:drev",k:10,ob:1,cap:"Phase 2: a flex associate opens a second damage-check table while the inbound row backs up, and leaves once it has drained. (model · anim)"}]},wrongsite:{stops:[{t:"The wrong-site hold",at:"zone:ex-ms",cap:"Items that arrive here but belong to another site are held apart from site stock until they can be sent on. (practice)"},{t:"Off the dock",at:"zone:ex-msin+line:d-ms",k:10,cap:"A wrong-site cage comes out of the dock’s west edge. An associate pulls it clear, walks round it and pushes it into the hold. (anim)"},{t:"Oldest out first",at:"zone:ex-ms+zone:ex-msin",cap:"When the hold is full, the oldest cage leaves from the west end of its row; in the animation it goes back into the dock. (anim)"},{t:"What to watch",at:"zone:ex-ms",cap:"Never stow a wrong-site item: it would show up as stock that isn’t yours. If the hold keeps filling, tell the shift lead so the items are shipped on. (practice)"}]},mainaisle:{stops:[{t:"Main aisle: keep right",at:"path:mainaisle",cap:"A two-way main aisle for cages, carts and tugger trains. Keep right: westbound on the north half, eastbound on the south. (model · practice)"},{t:"In: loaded tuggers up the east connector",at:"zone:yard-econ",cap:"Loaded tugger trains come up the east half of the east connector from the cross aisle. (model · anim)"},{t:"Tugger run west to the stow banks",at:"zone:yard-ave+slot:S1+slot:S2+slot:E1",cap:"Trains run west on the north half to the stow swap banks. The driver unhooks each cage and pushes it into a bank’s blue columns. No parking, staging or queuing on the aisle. (model · practice)"},{t:"Back down the west connector",at:"zone:yard-wcon+line:mt-dock+line:cw-ps",cap:"Tuggers take the empties down the west half of the west connector to the dock for cage build. Red problem-solve cages go down it to problem solve too. (model · anim)"},{t:"Sort cages east to the stations",at:"zone:yard-wcon+line:w-sort",cap:"Waterspiders bring yellow sort cages up the west connector and east along the main aisle to the sort stations; pallet jacks take full transfer-out pallets east. (model · anim)"},{t:"Phase 1: picked cages to the transfer-out lane",at:"slot:P+zone:yard-econ+slot:TXO+line:pk-esc",ob:0,cap:"Phase 1, Outbound off: picked cages leave bank P onto the main aisle and go down the east connector to the transfer-out lane. (model · anim)"},{t:"Phase 2: east to the Outbound WIP",at:"slot:P+aisle:oblink+slot:XBWIPW+slot:XBWIPE+line:pk-xd+line:pk-sort",ob:1,cap:"Phase 2, Outbound on: waterspiders take picked cages east on the south half to the Outbound WIP, or to the two east-end sort stations. (model · anim)"},{t:"Damages cages to problem solve",at:"slot:CWDMS+slot:PKDMS+line:cw-dps+line:pk-dps+slot:PSA+slot:PSB",cap:"Red damages cages from the cage swap and the pick drop zone go west and down the west connector to problem solve, which passes the cases on to damage review. (model · anim)"}]},obwip:{stops:[{t:"Outbound WIP",at:"path:obwip",ob:1,cap:"In phase 2, cages and tote pallets for the tail sorters wait here, in a row of green cage spots along each induct run. (model · anim)"},{t:"What fills it",at:"zone:ob-wip-W+zone:ob-wip-E+line:d-xdw+line:d-xde+line:sort-xd+line:rpk-xd+line:pk-xd+slot:P+zone:sort-08-to+zone:rpk-pair2",ob:1,cap:"Cross-dock cages from the receive dock, transfer out from sort and repack, and picked cages that don’t need sorting. In phase 1 these go to the transfer-out lane instead. (model)"},{t:"In from the north, out of the south",at:"zone:ob-wip-W",ob:1,cap:"Movers drop cages in from the link on the north side. The induct associate pulls the front cage out of the south end, oldest first. (anim)"},{t:"Induct: onto the conveyor",at:"zone:ob-induct-W",ob:1,k:12,cap:"An induct associate at each WIP lane empties the cage case by case onto the induct conveyor; a sort tote pallet goes tote by tote. Space the cases so the scan reads each one. (model · practice)"},{t:"Red damages cage",at:"slot:XBDMSW|zone:ob-wip-W",ob:1,k:10,cap:"Damaged cases found at the Outbound WIP go in the red damages cage in each sorter’s WIP row. A full one goes straight to damage review. (model)"},{t:"Empties back to the receive dock",at:"zone:ob-wip-W+zone:ob-wip-E+aisle:oblink+aisle:econ",ob:1,cap:"Empty cages nest beside each group. A waterspider pulls each nest west on the link and down the east connector to the receive dock. (model · anim)"}]},tailsort:{stops:[{t:"Two mirrored tail sorters",at:"path:tailsort",ob:1,cap:"Two tail sorters, mirrored, their U-turns facing each other, right next to the receive dock. (model)"},{t:"Onto the induct run",at:"zone:ob-induct-W",ob:1,cap:"Induct associates put cases from the WIP cages onto the induct run, which carries them to the U-turn. The second sorter mirrors it. (model · anim)"},{t:"Label scan on the U-turn",at:"zone:ob-lscan-W+zone:ob-lscan-E",ob:1,k:12,cap:"On each U-turn a label scan reads every case, with a scan associate beside it who scans each case as it passes. The label decides which lane the case goes down. (model)"},{t:"Back out past the diverters",at:"zone:ob-div-W1+zone:ob-div-W2+zone:ob-div-W3",ob:1,cap:"Scanned cases ride the return run back out past the gravity lanes. At each lane a diverter sends its cases down it. (model)"},{t:"A pusher at each diverter",at:"zone:ob-div-W2",ob:1,k:12,cap:"A pusher associate at each diverter pushes the case off the return run down its gravity lane. A jam at one diverter holds up every case behind it, so clear it fast. (model · practice)"}]},palbuild:{stops:[{t:"Pallet build",at:"path:palbuild",ob:1,cap:"Gravity lanes, with destination pallets on both sides. Both sorters build for the same set of destinations, one for each outbound lane. (model)"},{t:"Down the gravity lane",at:"line:ob-glW+zone:ob-lane-W2",ob:1,k:12,cap:"The pusher at the head of each lane sends cases down it. They roll to the far end and queue there for the builders. (model · anim)"},{t:"Each pallet is a destination",at:"zone:ob-lane-W2",ob:1,k:10,cap:"Each pallet along the lane is one destination, with pallets on both the outer and the inner side. (model · anim)"},{t:"Build the pallet",at:"zone:ob-lane-W2",ob:1,k:12,cap:"Builders on both sides take turns at the front case and build it onto its destination’s pallet: heavy cases low, labels facing out, square and stable. (model · practice)"},{t:"Close and move to the drop zone",at:"zone:ob-lane-W2+line:ob-pbW",ob:1,cap:"When a pallet is full the associate closes it, with a lid or stretch wrap, and moves it into the middle island; a new pallet takes its spot
