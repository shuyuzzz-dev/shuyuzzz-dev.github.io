<script>
const DOORS = ["01","02","03","04","05","06","07","X","08","09","10","11","12","13","14"];
const FLEX_DOORS = ["02","13"];
const DOOR_X0 = 390, DOOR_W = 60;
const LINES = [
  {n:1, x:400,  type:"fluid", door:"01"},
  {n:2, x:570,  type:"map",   doors:["03","04"],      head:"03"},
  {n:3, x:740,  type:"map",   doors:["05","06","07"], head:"06"},
  {n:4, x:910,  type:"map",   doors:["08","09"],      head:"08"},
  {n:5, x:1080, type:"map",   doors:["10","11","12"], head:"11"},
  {n:6, x:1250, type:"fluid", door:"14"},
];
const STALL_CAP = 6, CASES_PER_PALLET = 8, FLEX_CAP = 12, TABLE_CAP = 2, CAGE_CAP = 24;
const BUFFER_PULL = 8.5, BUF_AMBER = 12, SEAL_T = 1.5;
const CAGES = ["STOW","STOW","STOW","EACH", "STOW","STOW","XD","ITEM", "PSOL","MISC"];
const PLACARD = {STOW:"blue", XD:"green", PSOL:"red", EACH:"yellow", ITEM:"grey", MISC:"grey"};
const CAGE_WEIGHTS = [4.5,4,3,1.6, 4,3.5,1.1,0.7, 0.9,0.4];
const FORKS = [ {id:"forkA", label:"Forklift 1", lines:[2,3]}, {id:"forkB", label:"Forklift 2", lines:[4,5]} ];
const WATERSPIDERS = [ {id:"ws1", label:"Waterspider 1", lines:[1,2,3]}, {id:"ws2", label:"Waterspider 2", lines:[4,5,6]} ];
const FLEXZONES = [
  {id:"flexL1", door:"02", title:"FLEX L"},
  {id:"flexR1", door:"13", title:"FLEX R"},
];
const INFO = {
  door:{lane:"DOCK DOOR",title:"Dock door & trailer",owner:"Dock manager",
    what:["A trained associate releases the trailer to the dock before anyone works it, and every move starts with a door scan so the system knows which trailer is being unloaded.","Floor-loaded (fluid) trailers are hand-unloaded from inside the trailer straight onto a flex conveyor (lines 1 and 6). Palletized trailers are unloaded by forklift into the pallet zone right below the door (lines 2–5)."],
    controls:[["Trailer release","nobody works a trailer until it is released to the dock","practice"],["Freight type","fluid → unloaders + flex conveyor · pallets → forklift to the door's pallet zone","model"],["Escalation","zones turn amber as they fill and red at capacity","model"]],
    slides:[{title:"Door discipline",bullets:["Freight type decides the line: fluid → unloaders feed the flex conveyor; pallets → forklift to the pallet zone under the door","Keep each zone inside its limit before the next trailer is pulled","Separate people from forklift traffic at unload and staging"]}]},
  flexdoor:{lane:"FLEX DOOR",title:"Flex door — pallet unload only",owner:"Dock manager",
    what:["One extra door on each side, between the fluid lines and the pallet lines. No conveyor: pallets are unloaded by forklift straight into the flex zone below.","They add room for live unloads, overflow pallet staging and urgent trailers without tying up a conveyor line."],
    controls:[["Use cases","live unloads · overflow staging · urgent trailers","practice"]],
    slides:[{title:"Why flex doors",bullets:["Live unloads do not wait for a conveyor line","Overflow pallets stage here when a line's zones are full","Urgent trailers get worked on arrival instead of waiting in the yard"]}]},
  flexz:{lane:"FLEX PALLET ZONE",title:"Flex zone — overflow pallet staging",owner:"Dock manager · Receive manager",
    what:["One flex zone directly under each flex door. Pallets land here when every zone on a line is full, and can be received in place so their routing is known before a line frees up.","Single-item pallets can go straight to stow from here; mixed pallets wait for a line to break them down."],
    controls:[["Capacity","the positions drawn in the zone; amber when nearly full, red when full","anim"],["Order","first in, first out — oldest and most urgent first","practice"]],
    slides:[{title:"Flex zone rules",bullets:["First in, first out","Receive pallets as they land so routing is known early","Zone full → stop sending pallet trailers to flex doors and escalate"]}]},
  fork:{lane:"FORKLIFT · PALLET UNLOAD",title:"Forklift operator — pallet unload",owner:"Dock manager · certified operators",
    what:["Forklift operators unload mixed pallets from the trailer into the pallet zone under that door.","The forklift works only inside the dock zone: along the lane between the doors and the zones, back into the trailer, and down into the pallet zone or flex zone under that door. It never drives past the zone line into the depal, conveyor or cage areas. When every zone on its line is full it diverts the next pallet to a flex zone on its side.","Each move is scanned — the door first, then the pallet once it is set down — so the system knows where every pallet is."],
    controls:[["Travel","forklift lane + pallet zones only — never past the zone line","model"],["Certification","every operator certified before live work","practice"],["Pedestrian separation","marked forklift lanes; spotter at active stacking","practice"],["Zone being worked","the forklift does not drop into the zone the flex conveyor is in","model"]],
    slides:[{title:"Pallet unload",bullets:["Scan the dock door","Drive into the trailer, pick the pallet","Set it down in the door's pallet zone, scan the pallet → unload done"]},{title:"Then hand off to receive",bullets:["An associate receives the pallet in the zone","The scanner returns where it goes — follow it","Mixed pallets → depalletize on this line · single-item pallets → straight to stow"]}]},
  stall:{lane:"PALLET ZONE · WIP",title:"Pallet zone — receive & depalletize",owner:"Receive manager · depal associates",

function tick(now){const dt=Math.max(0,Math.min(0.05,(now-last)/1000));last=now;if(playing)step(dt*speed);requestAnimationFrame(tick);}
const q=new URLSearchParams(location.search);
if(q.get('vol')){vol=+q.get('vol');document.getElementById('vol').value=vol;}
if(q.get('t')){for(let k=0;k<(+q.get('t'))/0.05;k++)step(0.05);}if(document.documentElement.classList.contains('embed'))new IntersectionObserver(es=>{playing=es[0].isIntersecting;}).observe(document.getElementById('map'));
requestAnimationFrame(tick);
document.getElementById('legend').innerHTML=[
  `<span><i class="sw" style="background:var(--case);box-shadow:inset -3px 3px 0 var(--safety)"></i>CASE · YELLOW TAB = DESTINATION LABEL</span>`,
  `<span><i class="sw" style="background:var(--pallet)"></i>MIXED PALLET</span>`,
  `<span><i class="sw" style="background:var(--fork)"></i>FORKLIFT</span>`,
  `<span><i class="sw round" style="background:var(--safety)"></i>UNLOAD / DEPAL</span>`,
  `<span><i class="sw round" style="background:var(--chk)"></i>CHECK-IN</span>`,
  `<span><i class="sw round" style="background:var(--lbl)"></i>LABEL</span>`,
  `<span><i class="sw round" style="background:var(--c2c)"></i>CASE TO CAGE</span>`,
  `<span><i class="sw round" style="background:var(--ws)"></i>WATERSPIDER</span>`,
  `<span><i class="sw" style="background:#2e4a2a;border:1px solid var(--mint)"></i>BALL TRANSFER TABLE</span>`,
  `<span>CAGE PLACARD <i class="sw" style="background:var(--cage)"></i>STOW <i class="sw" style="background:var(--c2c)"></i>XD <i class="sw" style="background:var(--red)"></i>PSOL <i class="sw" style="background:var(--safety)"></i>EACH</span>`,
  `<span><i class="sw" style="background:var(--mint);opacity:.6"></i>FULL CAGE · SEALED ✓</span>`,
  `<span><i class="sw" style="border:1px dashed var(--cage);background:none"></i>DASHED · EMPTY CAGE / CAGE OUT WITH WS</span>`,
  `<span><i class="sw" style="background:#3d3312;border:1px solid var(--amber)"></i>AMBER · MANAGER ACTION</span>`,
  `<span><i class="sw" style="background:#4a1f22;border:1px solid var(--red)"></i>RED · ESCALATE / STOP</span>`,
  `<span style="margin-left:auto;color:var(--dim)">← → TOUR STOPS · ESC CLOSES</span>`,
].join('');
document.getElementById('legend').style.visibility='visible';
const fitLegend=()=>{ document.getElementById('mapwrap').style.paddingBottom=(document.getElementById('legend').offsetHeight+24)+'px'; };
fitLegend(); window.addEventListener('resize',fitLegend);
const volLbl={1:'Light',2:'Light',3:'Normal',4:'Normal',5:'Busy',6:'Busy',7:'Peak',8:'Peak',9:'Over plan',10:'Over plan'};
document.getElementById('vol').oninput=e=>{vol=+e.target.value;document.getElementById('vollbl').textContent=volLbl[vol];};
document.getElementById('vollbl').textContent=volLbl[vol];
document.getElementById('play').onclick=e=>{playing=!playing;e.target.textContent=playing?'⏸ Pause':'▶ Play';};
document.getElementById('speed').oninput=e=>speed=+e.target.value;
const tip=document.getElementById('tip'), wrap=document.getElementById('mapwrap');
gConv.querySelectorAll('.conv').forEach(p=>{
  p.addEventListener('mousemove',e=>{const inf=INFO[p.dataset.info], c=inf.controls[0]||[]; const r=wrap.getBoundingClientRect();
    tip.style.display='block'; tip.style.left=(e.clientX-r.left+14)+'px'; tip.style.top=(e.clientY-r.top+14)+'px';
    tip.innerHTML=`<b>${p.dataset.label}</b><br>${c[0]?c[0]+': '+c[1]:''}<br><span style="opacity:.7">click for detail</span>`;});
  p.addEventListener('mouseleave',()=>tip.style.display='none');
});
const panel=document.getElementById('panel');
const EMPTY=`<div class="empty"><p class="eyebrow"><b>✦</b> THE RECEIVE DOCK · 17 TOUR STOPS</p><h2>Pick a stop.<br><span>See the process and the standard.</span></h2>Click a door, pallet zone, forklift, associate, conveyor, ball transfer table, label station, cage, waterspider or the full-cage buffer. Press <b>Guided tour</b> to walk the dock in flow order. Drag <b>Volume</b> up to watch the pallet zones fill, throwers double up, cages fill and the waterspiders swap them out.<p class="ref" style="margin-top:16px">Illustrative model with an invented layout — not a real site and not live data. Doors, lines, rates and capacities are animation settings.</p></div>`;
panel.innerHTML=EMPTY;
function infoOf(id){const z=zones[id];return {inf:INFO[z.info],name:z.label||INFO[z.info].title};}
function deckHTML(inf){const s=inf.slides[Math.min(slideIdx,inf.slides.length-1)];
  return `<div class="deck"><div class="slide"><div class="k">${inf.title.toUpperCase()} · ${slideIdx+1} / ${inf.slides.length}</div><h4>${s.title}</h4><ol>${s.bullets.map(b=>`<li>${b}</li>`).join('')}</ol></div>
  <div class="deckbar"><button id="sprev" ${slideIdx===0?'disabled':''}>‹ Prev</button><button id="snext" ${slideIdx>=inf.slides.length-1?'disabled':''}>Next ›</button><span class="n">BUILT-IN SLIDES</span></div></div>`;}
function render(){
  const {inf,name}=infoOf(active), idx=order.indexOf(active);
  const fa=document.activeElement, keep=panel.contains(fa)?(fa.dataset.t?`[data-t=${fa.dataset.t}]`:fa.id?'#'+fa.id:null):null;
  panel.innerHTML=`
   <div class="ph"><p class="eyebrow">${inf.lane}${idx>=0?` · <b>STOP ${idx+1} / ${order.length}</b>`:''}</p><h2>${name}</h2><div class="owner">${name!==inf.title?inf.title+' · ':''}Owner: ${inf.owner}</div></div>
   <div class="tabs" role="tablist">${[['overview','OVERVIEW'],['slides','SLIDES']].map(([t,l])=>`<button role="tab" data-t="${t}" aria-selected="${tab===t}">${l}</button>`).join('')}</div>
   <div class="tab ${tab==='overview'?'on':''}"><h3>WHAT HAPPENS HERE</h3><ul>${inf.what.map(w=>`<li>${w}</li>`).join('')}</ul>
     ${inf.controls.length?`<h3>KEY CONTROLS & THRESHOLDS</h3><div class="kv">${inf.controls.map(([k,v,s])=>`<div>${k} <span class="ref">(${s})</span></div><div class="v">${v}</div>`).join('')}</div>`:''}
     <p class="ref" style="margin-top:14px">(model) how this illustration works · (practice) common receive-dock practice · (anim) animation setting, not a measured rate. Illustrative model with an invented layout — not a real site.</p></div>
   <div class="tab ${tab==='slides'?'on':''}">${deckHTML(inf)}</div>
   <div class="navrow"><button id="prev" ${idx<=0?'disabled':''}>‹ Previous stop</button><button id="next" ${idx<0||idx>=order.length-1?'disabled':''}>Next stop ›</button></div>`;
  panel.querySelectorAll('[role=tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render();});
  const sp=panel.querySelector('#sprev'),sn=panel.querySelector('#snext'); if(sp)sp.onclick=()=>{slideIdx--;render();}; if(sn)sn.onclick=()=>{slideIdx++;render();};
  panel.querySelector('#prev').onclick=()=>select(order[idx-1]); panel.querySelector('#next').onclick=()=>select(order[idx+1]);
  if(keep){const n=panel.querySelector(keep);(n&&!n.disabled?n:panel.querySelector('button:not([disabled])'))?.focus();}
}
function clearActive(){document.querySelectorAll('.active,.tourglow,.hot').forEach(z=>z.classList.remove('active','tourglow','hot'));}
function select(id){
  const z=zones[id]; if(!z)return; clearActive(); active=id; slideIdx=0;
  z.g.classList.add(z.g.classList.contains('conv')?'hot':'active');
  if(id.startsWith('door:')){const d=id.split(':')[1]; paths.filter(p=>p.kind==='feed'&&p.door===d).forEach(p=>p.el.classList.add('hot'));}
  render();
}
document.addEventListener('keydown',e=>{if((e.key==='ArrowLeft'||e.key==='ArrowRight')&&e.target.closest&&e.target.closest('input,select,textarea,[role=tab]'))return;
  if(e.key==='Escape'){stopTour();clearActive();active=null;panel.innerHTML=EMPTY;}
  if(e.key==='ArrowRight'){const i=active?order.indexOf(active):-1;if(i<order.length-1)select(order[i+1]);}
  if(e.key==='ArrowLeft'){const i=active?order.indexOf(active):order.length;if(i>0)select(order[i-1]);}
});
order.push('door:03','forkA','stall:03','dpl2a','conv2','table2','pconv2','label2','c2c2_0','cage2_0','ws1','buffer','door:01','conv1','door:02','flexL1','walk');
const tourBtn=document.getElementById('tour');
function stopTour(){if(tourTimer){clearInterval(tourTimer);tourTimer=null;tourBtn.textContent='▶ Guided tour';tourBtn.setAttribute('aria-pressed','false');}}
function glow(id){const z=zones[id];if(z&&z.g.classList.contains('zone'))z.g.classList.add('tourglow');}
tourBtn.onclick=()=>{ if(tourTimer){stopTour();return;} let i=0;tab='overview';select(order[0]);glow(order[0]);
  tourBtn.textContent='■ Stop tour';tourBtn.setAttribute('aria-pressed','true');
  tourTimer=setInterval(()=>{i++;if(i>=order.length){stopTour();return;}select(order[i]);glow(order[i]);},7000/Math.max(.5,speed)); };
window.addEventListener('load',()=>{ if(q.get('sel'))select(q.get('sel')); if(q.get('tab')){tab=q.get('tab')==='slides'?'slides':'overview';if(active)render();} });
</script>
</body>
